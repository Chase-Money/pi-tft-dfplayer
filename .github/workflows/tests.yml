name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  v2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest
          pip install -e .
      - name: Run v2 test suite
        run: |
          python -m pytest -q \
            tests/ui/test_draw_utils_v2.py \
            tests/core/test_profile_select_v3.py \
            tests/core/test_profile_select_v2.py \
            tests/hardware/test_display_st7735.py \
            tests/hardware/test_button_input.py \
            tests/main/test_main_touch_v2.py
